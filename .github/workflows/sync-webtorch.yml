name: Sync webtorch SDK

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [webtorch-main-updated]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: webtorch-sdk-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Update bundled SDK from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/laya-service/sync-webtorch.mjs
      - name: Commit changed SDK files
        id: commit
        run: |
          git add -A -- deploy/laya-service/vendor/webtorch
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update bundled webtorch SDK'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN does not start a push workflow. Dispatch explicitly.
      - name: Rebuild and publish container
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run container.yml --ref main
