edition: 3.0.0
name: prediction-market-agent
access: default
resources:
  web:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: prediction-market-agent
      runtime: custom.debian12
      handler: index.handler
      timeout: 300
      memorySize: 1024
      diskSize: 512
      code: ./build
      vpcConfig: auto
      nasConfig: auto
      logConfig: auto
      customRuntimeConfig:
        command:
          - /bin/sh
          - -c
        args:
          - python3 -m uvicorn prediction_market_agent.runtime.cloud:application --host 0.0.0.0 --port 9000
        port: 9000
      triggers:
        - triggerName: http
          triggerType: http
          description: Robot management application
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
