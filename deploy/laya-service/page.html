<!doctype html>
<meta charset="utf-8">
<title>laya</title>
<!--
  This page exists to give one model a GPU and a place to run, and nothing else.

  webtorch is CPython compiled to WebAssembly with a WebGPU backend, so the model runs where a
  browser is: there is no server-side build of it, and the alternative on a machine without one is
  numpy on the CPU, which for an 800 MB encoder is not an alternative. The service that owns this
  page drives it headlessly and speaks HTTP to everything else.

  Two script tags and `webtorch.start()`, as the SDK's own getting-started says: that call makes
  the worker, brings up the backend and Python inside it, and hands back functions. Nothing here
  chooses a model - the SDK's demo page can load anything, this one serves laya and only laya.

  The page has to be a secure context, which loopback is: the server in front of this listens on
  127.0.0.1 and sends the two isolation headers itself, so no service worker is needed. Off a
  secure origin there is no cross-origin isolation, the worker cannot reach the GPU, and everything
  runs on the CPU with nothing said about it.
-->
<body>
<pre id="log">booting…</pre>
<script src="../dist/wgpy-main.js"></script>
<script src="../webtorch/js/webtorch-main.js"></script>
<script>
// The one model this service exists for, as the SDK's own catalogue lists it: the whole repo,
// no `file:` inside it, about 0.8 GB.
const LAYA = 'convaiinnovations/laya';

const state = { ready: false, error: '', model: '', backend: '', surface: null, status: '', source: '' };
const say = (text) => {
  state.status = String(text);
  document.getElementById('log').textContent = state.status;
};
let wt = null;

// Registered before anything else: the SDK can fail while it is still starting, and a failure
// nobody heard leaves a page that says "booting" forever.
if (webtorch.onError) webtorch.onError((error) => {
  state.error = String((error && error.message) || error);
  say('failed: ' + state.error);
});

(async () => {
  try {
    wt = await webtorch.start({ baseURL: '../', onStatus: say });
    state.backend = String(wt.backend || (wt.stats && wt.stats().backend) || '');
    // Where the weights come from is ours to say, not the SDK's: it reads nothing until a reader
    // is installed. `?local=` means this service already has the files on disk and serves them
    // from its own origin - no hub, no second download, the same bytes every boot. Without it we
    // fetch the repo once from Hugging Face so that the service can write that local copy.
    const local = new URLSearchParams(location.search).get('local');
    state.source = local || LAYA;
    await wt.run(local
      ? 'import webtorch\nwebtorch.use_default_io()'
      : 'import webtorch\nwebtorch.set_io_read(webtorch.hf_read())\nwebtorch.set_io_write(webtorch.default_io_write)');
    say('loading ' + state.source + ' …');
    const info = await wt.load(state.source, {
      onProgress: (p) => say('read ' + Math.round((p.bytes || 0) / 1048576) + ' MB'
        + (p.total ? ' / ' + Math.round(p.total / 1048576) + ' MB' : '')),
      onStage: (s) => say(String(s.stage || s)),
    });
    state.model = LAYA;
    state.surface = (info && info.surface) || null;
    state.ready = true;
    say('ready: ' + LAYA + (state.backend ? ' on ' + state.backend : ''));
  } catch (error) {
    state.error = String((error && error.stack) || error);
    say('failed: ' + state.error);
  }
})();

// What the service calls. Questions in, the model's own answers out: no thresholds and no
// interpretation, because whoever asked is the one entitled to draw a conclusion from them.
window.__laya = {
  status: () => ({ ...state }),
  decide: async (request) => {
    if (!state.ready) throw new Error(state.error || 'model is not ready yet');
    return wt.decide(request.state, request.questions);
  },
};
</script>
</body>
