[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-agent"
version = "2.0.0"
description = "Multi-platform prediction-market Agent with plugin APIs and online execution"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.2,<2",
  "polymarket-client>=0.3,<0.4",
]

[project.scripts]
prediction-market-agent = "prediction_market_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prediction_market_agent = ["config/*.json", "plugins/strategies/prompts/*.md", "plugins/strategies/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
