[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-prediction-paper-bot"
version = "1.1.0"
description = "Multi-platform prediction-market Agent with plugin APIs and online execution"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.2,<2",
  "polymarket-client>=0.3,<0.4",
]

[project.scripts]
prediction-paper-bot = "prediction_paper_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prediction_paper_bot = ["config/*.json", "strategies/*.md", "strategies/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
