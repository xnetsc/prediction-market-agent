[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-agent"
version = "3.0.1"
description = "Deployable multi-platform prediction-market trading robot"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117,<1",
  "mangum>=0.19,<1",
  "polymarket-client>=0.3,<0.4",
  "uvicorn>=0.35,<1",
  "webauthn>=3,<4",
]

[project.scripts]
prediction-market-agent = "prediction_market_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prediction_market_agent = ["config/*.json", "plugins/strategies/prompts/*.md", "plugins/strategies/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
