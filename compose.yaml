services:
  robot:
    image: ${PREDICTION_AGENT_IMAGE:-ghcr.io/xnetsc/prediction-market-agent:latest}
    # Updates come from the startup scripts, which pull from this same address every run and
    # only fall back to a proxy when it cannot be reached. Compose still fetches the image
    # itself when it is missing, so `docker compose up` on its own keeps working.
    pull_policy: missing
    extra_hosts:
      - "host.proxy.internal:host-gateway"
    ports:
      - "127.0.0.1:${PREDICTION_AGENT_PORT:-8765}:8765"
    volumes:
      - ./runtime-data:/data
      - ./runtime-data/home:/root
    restart: unless-stopped
